# ------------------------------------------------------------------
# Visual customizations
set -g status-position bottom

# Status bar colors
set -g status-bg black
set -g status-fg white

# Right side - date and time
set -g status-right '#[fg=white]%Y-%m-%d #[fg=white]%H:%M'

# Add padding around the active window name
set -g window-status-current-format '#[bg=black,fg=green,bold] | #W'

# Inactive windows with padding too
set -g window-status-format ' | #W'

# ------------------------------------------------------------------
# Key bindings for pane navigation
bind-key i select-window -t :0
bind-key a select-window -t 1 \; select-pane -t 0
bind-key t select-window -t 2 \; select-pane -t 2
bind-key r select-window -t 2 \; select-pane -t 0
bind-key g select-window -t 3

# ------------------------------------------------------------------
# Plugin management with TPM
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Optional: auto-restore last saved session on tmux start
# set -g @continuum-restore 'on'

# Optional: auto-save interval (in minutes, default is 15)
set -g @continuum-save-interval '15'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
