# ~/.tmux.conf
# ═══════════════════════════════════════════════════════════════════
#  1. CORE
#     tmux-sensible already handles escape-time, history-limit,
#     display-time and status-interval — don't duplicate them here.
# ═══════════════════════════════════════════════════════════════════

# True color. Without this your #RRGGBB values below get approximated
# to the nearest 256-color slot — tmux-sensible sets default-terminal
# to screen-256color, which has no truecolor support.
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",*256col*:Tc,alacritty:Tc,xterm-ghostty:Tc"

set  -g  mouse on
setw -g  mode-keys vi
set  -g  repeat-time 600          # window for -r bindings
set  -g  focus-events on          # lets agent plugins see focus changes


# ═══════════════════════════════════════════════════════════════════
#  2. PLUGIN OPTIONS   (must be set BEFORE tpm loads at the bottom)
# ═══════════════════════════════════════════════════════════════════

# --- hiroppy/tmux-agent-sidebar ---
set -g @sidebar_width         '20%'
set -g @sidebar_position      'left'
set -g @sidebar_bottom_height '20'      # Activity/Git panel height, 0 hides it
# Toggles: prefix + e (this window) / prefix + E (all windows)

# --- tmux-continuum ---
# save-interval 15 is already the default, so it's omitted.
# Uncomment to auto-restore the last saved environment on tmux start:
# set -g @continuum-restore 'on'


# ═══════════════════════════════════════════════════════════════════
#  3. APPEARANCE
# ═══════════════════════════════════════════════════════════════════

set -g status-position bottom
set -g status-style "bg=black,fg=white"       # replaces deprecated status-bg/-fg
set -g status-right "#[fg=white]%Y-%m-%d %H:%M "

# Two-row status bar: row 0 is a thin filled band acting as a separator
# between the panes and the status line; row 1 is the real status bar.
set -g status 2
set -g status-format[0] "#[bg=#3b4048]#[fill=#3b4048]"
set -g status-format[1] "#[align=left]#{W:#[fg=white] | #W,#[fg=#a76c97 bold] | #W}#[align=right]#{E:status-right}"

# Kept for reference — status-format above bypasses these, but they
# still apply if you ever drop back to a single-row status bar.
set -g window-status-current-format "#[fg=#a76c97,bold] | #W"
set -g window-status-format         "#[fg=white] | #W"

# Pane borders — active is PANTONE 17-3014 TCX Mulberry
set -g pane-border-style        "fg=#3b4048"
set -g pane-active-border-style "fg=#a76c97,bold"
set -g pane-border-lines        double        # tmux 3.2+; falls back to
                                              # single if the font lacks ═ ║

# Arrows point at the active pane. Borders are SHARED between adjacent
# panes, so colour alone can't tell you which side is active — the
# arrows resolve that ambiguity. off | colour | arrows | both
set -g pane-border-indicators   both

# Per-pane title bar. This is the closest thing to a real per-pane
# border: each pane gets its own line, styled independently.
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#a76c97 bold],#[fg=#3b4048]} #P #{pane_title} "
set -g pane-border-format " #{pane_current_command} #[fg=#5c6370]#{b:pane_current_path} "

# Dim inactive panes — the strongest "which pane am I in" signal.
# Do NOT add bg= here; it breaks terminal transparency and TUI rendering.
set -g window-style        "fg=#8a8a8a"
set -g window-active-style "fg=#e8e8e8"

# Pane-number overlay (prefix + q)
set -g display-panes-time           2000
set -g display-panes-active-colour  "#a76c97"
set -g display-panes-colour         "#3b4048"


# ═══════════════════════════════════════════════════════════════════
#  4. KEY BINDINGS
# ═══════════════════════════════════════════════════════════════════

# --- Jump to a specific workspace ---
# Consistent -t syntax. See NOTES at the bottom re: pane indices.
bind i select-window -t 0                       # ide
bind a select-window -t 1 \; select-pane -t 0   # ai slave
bind t select-window -t 2 \; select-pane -t 1   # terminal
bind r select-window -t 2 \; select-pane -t 0
bind g select-window -t 3                       # git

# --- Pane navigation (vim keys) ---
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Reclaim last-window, which `bind -r l` above overwrote.
bind Tab last-window

# --- Pane resize ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Splits (open in the current directory) ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -fv -c "#{pane_current_path}"   # full width, below

# Reload. tmux-sensible binds prefix + R to this already; this is the
# explicit version so it survives if you ever drop tmux-sensible.
bind R source-file ~/.config/tmux/tmux.conf \; display "config reloaded"


# ═══════════════════════════════════════════════════════════════════
#  5. PLUGINS  —  tmux-continuum MUST stay last (it appends to
#     status-right, and anything loaded after it can clobber that).
# ═══════════════════════════════════════════════════════════════════

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'hiroppy/tmux-agent-sidebar'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'          # keep at the very bottom


# ═══════════════════════════════════════════════════════════════════
#  NOTES
#
#  Pane indices are fragile with an auto-creating sidebar.
#  @sidebar_auto_create defaults to 'on', so the plugin injects a pane
#  into each window — which shifts every pane index. Your `bind a` and
#  `bind t` target pane 0 and 1 by number, so they may land on the
#  sidebar instead of the agent. If that happens, either:
#
#    a) set -g @sidebar_auto_create 'off'   (create it manually w/ prefix+e)
#    b) verify indices with prefix + q and adjust the numbers
#    c) target by direction instead:  bind a select-window -t 1 \; select-pane -R
#
#  base-index / pane-base-index are left at 0 on purpose — setting them
#  to 1 would silently break every numbered binding in section 4.
# ═══════════════════════════════════════════════════════════════════
